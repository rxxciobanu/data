[project]
name = "polymarket-orchestrator"
version = "0.1.0"
description = "AI orchestrator that debates Polymarket outcomes and alerts on betting opportunities"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "py-clob-client>=0.0.1",
    "fastmcp>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
news = ["feedparser>=6.0.11"]

[project.scripts]
polymarket-orchestrator = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
